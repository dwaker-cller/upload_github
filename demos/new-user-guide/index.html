<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MeetInfluencer 新手达人教程 Demo（单文件版）</title>
    <style>
:root {
  color-scheme: light;
  --bg: #f4f6fb;
  --panel: #ffffff;
  --panel-soft: #fbfcff;
  --border: #dde5f1;
  --border-strong: #cbd7e8;
  --text: #111827;
  --muted: #667085;
  --soft: #8a97aa;
  --pink: #ec4899;
  --pink-dark: #db2777;
  --violet: #8b5cf6;
  --green: #0f9f6e;
  --orange: #e58a00;
  --red: #d92d20;
  --shadow: 0 18px 45px rgba(31, 41, 55, 0.12);
  --sidebar: 260px;
}

* {
  box-sizing: border-box;
}

[hidden] {
  display: none !important;
}

body {
  margin: 0;
  min-width: 1180px;
  background: var(--bg);
  color: var(--text);
  font-family: Inter, "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  letter-spacing: 0;
}

button,
input,
textarea {
  font: inherit;
}

button {
  border: 0;
  cursor: pointer;
}

img {
  display: block;
  max-width: 100%;
}

.app-shell {
  display: grid;
  grid-template-columns: var(--sidebar) minmax(0, 1fr);
  min-height: 100vh;
}

.sidebar {
  position: sticky;
  top: 0;
  height: 100vh;
  padding: 22px 16px;
  border-right: 1px solid var(--border);
  background: linear-gradient(180deg, #ffffff 0%, #f7f8fc 100%);
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  height: 46px;
  margin-bottom: 24px;
}

.brand strong,
.brand small {
  display: block;
}

.brand strong {
  font-size: 15px;
}

.brand small {
  margin-top: 3px;
  color: var(--soft);
}

.brand-mark {
  position: relative;
  width: 52px;
  height: 38px;
}

.brand-mark span {
  position: absolute;
  top: 5px;
  width: 12px;
  height: 34px;
  border-radius: 8px;
  transform: rotate(28deg);
}

.brand-mark span:nth-child(1) {
  left: 6px;
  background: #2563eb;
}

.brand-mark span:nth-child(2) {
  left: 20px;
  background: var(--pink);
}

.brand-mark span:nth-child(3) {
  left: 34px;
  background: #f4b400;
}

.nav-list {
  display: grid;
  gap: 8px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  height: 42px;
  padding: 0 12px;
  border-radius: 14px;
  background: transparent;
  color: #465266;
  text-align: left;
}

.nav-item:hover,
.nav-item.is-active {
  background: #ffffff;
  color: var(--text);
  box-shadow: 0 10px 30px rgba(31, 41, 55, 0.08);
}

.nav-dot {
  width: 16px;
  height: 16px;
  border: 1px solid #f3b3d7;
  border-radius: 50%;
  background: #ffeaf5;
}

.main {
  min-width: 0;
  padding: 0 24px 48px;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 30;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 12px;
  height: 72px;
  margin: 0 -24px 18px;
  padding: 0 28px;
  border-bottom: 1px solid var(--border);
  background: rgba(248, 250, 255, 0.92);
  backdrop-filter: blur(10px);
}

.notification-btn {
  position: relative;
  width: 36px;
  height: 36px;
  border: 1px solid var(--border);
  border-radius: 50%;
  background: #fff;
}

.notification-btn::before {
  content: "";
  position: absolute;
  inset: 10px 11px 9px;
  border: 1.8px solid #64748b;
  border-top-left-radius: 8px;
  border-top-right-radius: 8px;
  border-bottom-left-radius: 5px;
  border-bottom-right-radius: 5px;
}

.notification-count {
  position: absolute;
  top: -8px;
  right: -5px;
  min-width: 25px;
  height: 20px;
  padding: 0 6px;
  border-radius: 12px;
  background: #ef4444;
  color: #fff;
  font-size: 12px;
  font-weight: 800;
  line-height: 20px;
}

.guide-entry,
.primary-btn,
.reset-btn {
  min-height: 36px;
  padding: 0 18px;
  border-radius: 13px;
  background: linear-gradient(135deg, #f55da9 0%, #c936d7 100%);
  color: #fff;
  font-weight: 800;
  box-shadow: 0 12px 24px rgba(219, 39, 119, 0.22);
}

.guide-entry {
  height: 42px;
  padding: 0 22px;
}

.primary-btn:hover,
.guide-entry:hover,
.reset-btn:hover {
  filter: brightness(0.98);
}

.secondary-btn,
.text-btn,
.account-btn,
.filter-panel button,
.project-filters button,
.tab {
  min-height: 36px;
  padding: 0 14px;
  border: 1px solid var(--border);
  border-radius: 13px;
  background: #fff;
  color: #475467;
  font-weight: 700;
}

.secondary-btn:hover,
.filter-panel button:hover,
.project-filters button:hover {
  border-color: #f2a5cf;
  color: var(--pink-dark);
}

.secondary-btn.compact,
.primary-btn.compact {
  min-height: 32px;
  padding: 0 12px;
  border-radius: 10px;
  font-size: 13px;
}

.primary-btn.large {
  min-height: 44px;
  padding: 0 24px;
}

.text-btn {
  border: 0;
  background: transparent;
  color: var(--pink-dark);
  box-shadow: none;
}

.account-btn {
  height: 42px;
  border-color: #f8c7df;
  color: #697386;
}

.view {
  display: none;
}

.view.is-visible {
  display: block;
}

.page-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin: 18px 0 28px;
}

h1,
h2,
p {
  margin: 0;
}

h1 {
  font-size: 28px;
  line-height: 1.2;
}

h2 {
  font-size: 16px;
}

p {
  color: var(--muted);
  line-height: 1.6;
}

.filter-panel {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 32px;
  padding: 14px;
  border: 1px solid var(--border);
  border-radius: 22px;
  background: rgba(255, 255, 255, 0.92);
  box-shadow: 0 12px 28px rgba(31, 41, 55, 0.08);
}

.filter-panel button:not(.reset-btn) {
  flex: 1 1 150px;
  justify-content: flex-start;
  min-height: 42px;
  text-align: left;
}

.filter-panel button:not(.reset-btn)::after,
.project-filters button:not(.tab)::after {
  content: "";
  float: right;
  width: 7px;
  height: 7px;
  margin-top: 5px;
  border-right: 1.5px solid #98a2b3;
  border-bottom: 1.5px solid #98a2b3;
  transform: rotate(45deg);
}

.campaign-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(260px, 1fr));
  gap: 18px;
  align-items: stretch;
}

.campaign-card {
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: 17px;
  background: #fff;
  box-shadow: 0 12px 30px rgba(31, 41, 55, 0.12);
}

.campaign-card img {
  width: 100%;
  height: 70px;
  object-fit: cover;
}

.campaign-body {
  padding: 12px;
}

.campaign-title-row {
  display: grid;
  grid-template-columns: 1fr auto auto;
  gap: 6px;
  align-items: start;
  min-height: 48px;
}

.campaign-title-row h2 {
  min-width: 0;
  font-size: 16px;
  line-height: 1.35;
}

.badge,
.status {
  display: inline-flex;
  align-items: center;
  width: max-content;
  min-height: 22px;
  padding: 0 8px;
  border: 1px solid #d9c2ff;
  border-radius: 999px;
  background: #f6efff;
  color: var(--violet);
  font-size: 12px;
  font-weight: 800;
}

.badge.official {
  background: #efe6ff;
}

.campaign-card p {
  margin: 8px 0 14px;
  font-size: 12px;
}

.campaign-meta {
  display: grid;
  grid-template-columns: 1fr 1fr auto;
  gap: 12px;
  align-items: end;
  padding-top: 10px;
  border-top: 1px solid var(--border);
}

small {
  display: block;
  color: var(--muted);
  font-size: 11px;
}

.campaign-meta strong {
  display: block;
  margin-top: 2px;
  color: var(--pink-dark);
  font-size: 14px;
}

.detail-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 320px;
  gap: 22px;
}

.detail-main,
.detail-side,
.table-card,
.timeline-card,
.profile-form,
.profile-side,
.auth-card,
.metrics > div,
.notification-list article {
  border: 1px solid var(--border);
  border-radius: 18px;
  background: var(--panel);
  box-shadow: 0 12px 30px rgba(31, 41, 55, 0.08);
}

.detail-main,
.detail-side {
  padding: 22px;
}

.detail-heading {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 18px;
}

.detail-heading h1 {
  margin-top: 10px;
}

.detail-strip {
  overflow: hidden;
  height: 120px;
  margin-bottom: 20px;
  border-radius: 14px;
}

.detail-strip img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.detail-section {
  padding: 18px 0;
  border-top: 1px solid var(--border);
}

.detail-section h2 {
  margin-bottom: 12px;
}

.info-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}

.info-grid > div,
.price-box {
  padding: 14px;
  border-radius: 14px;
  background: var(--panel-soft);
}

.info-grid strong,
.detail-side dd {
  display: block;
  margin-top: 4px;
}

.price-box {
  margin: 16px 0;
  color: var(--pink-dark);
  font-size: 24px;
  font-weight: 850;
}

dl {
  display: grid;
  gap: 14px;
  margin: 0;
}

dt {
  color: var(--muted);
  font-size: 12px;
}

dd {
  margin: 0;
}

.table-card {
  overflow: hidden;
}

.table-title,
.project-filters {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 16px;
}

.project-filters {
  justify-content: flex-start;
  margin-bottom: 14px;
  padding: 0;
}

.tabs {
  display: flex;
  gap: 8px;
}

.tab.is-active {
  border-color: #f2a5cf;
  background: #fff0f7;
  color: var(--pink-dark);
}

table {
  width: 100%;
  border-collapse: collapse;
}

th,
td {
  padding: 14px 16px;
  border-top: 1px solid var(--border);
  text-align: left;
  vertical-align: middle;
}

th {
  color: var(--muted);
  font-size: 12px;
  font-weight: 800;
}

td {
  color: #263143;
}

.practice-row {
  background: #fffbfe;
}

.status.pending {
  border-color: #ffd59d;
  background: #fff7e8;
  color: var(--orange);
}

.status.rejected {
  border-color: #f6b2ad;
  background: #fff1f0;
  color: var(--red);
}

.actions {
  display: flex;
  gap: 8px;
}

.timeline-card {
  margin-top: 16px;
  padding: 18px;
}

.timeline {
  display: grid;
  gap: 14px;
  margin: 18px 0 0;
  padding: 0;
  list-style: none;
}

.timeline li {
  position: relative;
  min-height: 42px;
  padding-left: 34px;
}

.timeline li::before {
  content: "";
  position: absolute;
  left: 0;
  top: 3px;
  width: 20px;
  height: 20px;
  border: 2px solid var(--border-strong);
  border-radius: 50%;
  background: #fff;
}

.timeline li.done::before {
  border-color: var(--green);
  background: var(--green);
}

.timeline li.current::before {
  border-color: var(--pink);
  box-shadow: 0 0 0 5px rgba(236, 72, 153, 0.15);
}

.timeline strong,
.timeline span {
  display: block;
}

.timeline span {
  margin-top: 3px;
  color: var(--muted);
  font-size: 13px;
}

.profile-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 340px;
  gap: 18px;
}

.profile-form {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
  padding: 20px;
}

.profile-side {
  padding: 20px;
}

label {
  display: grid;
  gap: 7px;
  color: #344054;
  font-weight: 800;
}

label.wide {
  grid-column: 1 / -1;
}

input,
textarea {
  width: 100%;
  min-height: 42px;
  border: 1px solid var(--border-strong);
  border-radius: 12px;
  background: #fff;
  color: var(--text);
  padding: 10px 12px;
}

textarea {
  min-height: 98px;
  resize: vertical;
}

input:disabled {
  background: #f4f6f9;
  color: #98a2b3;
}

.account-chip {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin: 16px 0 10px;
  padding: 13px;
  border-radius: 14px;
  background: #f0fdf8;
  color: #075e43;
  font-weight: 800;
}

.account-chip span {
  color: var(--green);
}

.account-chip.muted {
  background: #f8fafc;
  color: #475467;
}

.account-chip.muted span {
  color: var(--orange);
}

.auth-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 18px;
}

.auth-card {
  display: grid;
  gap: 18px;
  padding: 20px;
}

.auth-card.is-current {
  border-color: #f2a5cf;
  box-shadow: 0 12px 34px rgba(236, 72, 153, 0.14);
}

.platform-mark {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 38px;
  height: 38px;
  margin-bottom: 10px;
  border-radius: 12px;
  background: #111827;
  color: #fff;
  font-weight: 900;
}

.auth-form {
  display: grid;
  gap: 14px;
}

.upload-box {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 80px;
  border: 1px dashed #cbd5e1;
  border-radius: 14px;
  background: #f8fafc;
  color: var(--pink-dark);
  font-weight: 850;
}

.metrics {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
}

.metrics > div {
  padding: 20px;
}

.metrics strong {
  display: block;
  margin: 10px 0;
  font-size: 28px;
}

.metrics span {
  color: var(--muted);
}

.notification-list {
  display: grid;
  gap: 12px;
}

.notification-list article {
  padding: 18px;
}

.notification-list strong,
.notification-list span {
  display: block;
}

.notification-list span {
  margin-top: 5px;
  color: var(--muted);
}

.guide-drawer {
  position: fixed;
  z-index: 70;
  top: 0;
  right: 0;
  width: 420px;
  height: 100vh;
  padding: 24px;
  border-left: 1px solid var(--border);
  background: #ffffff;
  box-shadow: -20px 0 60px rgba(15, 23, 42, 0.16);
  transform: translateX(105%);
  transition: transform 180ms ease;
}

.guide-drawer.is-open {
  transform: translateX(0);
}

.drawer-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
}

.eyebrow {
  display: block;
  margin-bottom: 7px;
  color: var(--pink-dark);
  font-size: 12px;
  font-weight: 900;
  text-transform: uppercase;
}

.drawer-head h2 {
  font-size: 24px;
}

.icon-btn {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: #f8fafc;
  color: #475467;
  font-weight: 900;
}

.drawer-copy {
  margin: 18px 0;
  font-size: 14px;
}

.guide-progress {
  height: 8px;
  overflow: hidden;
  margin-bottom: 18px;
  border-radius: 999px;
  background: #f1f5f9;
}

.guide-progress span {
  display: block;
  width: 0%;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(135deg, var(--pink), var(--violet));
  transition: width 180ms ease;
}

.guide-list {
  display: grid;
  gap: 10px;
}

.guide-task {
  display: grid;
  grid-template-columns: 34px 1fr;
  gap: 12px;
  width: 100%;
  padding: 14px;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: #fff;
  color: var(--text);
  text-align: left;
}

.guide-task:hover,
.guide-task.is-complete {
  border-color: #f2a5cf;
  background: #fff8fc;
}

.guide-task > span {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: #ffeaf5;
  color: var(--pink-dark);
  font-weight: 900;
}

.guide-task small {
  margin-top: 4px;
  font-size: 12px;
  line-height: 1.45;
}

.overlay {
  position: fixed;
  z-index: 50;
  inset: 0;
  background: rgba(15, 23, 42, 0.18);
  pointer-events: none;
}

.is-highlight {
  position: relative;
  z-index: 60;
  outline: 4px solid rgba(236, 72, 153, 0.75);
  outline-offset: 5px;
  box-shadow: 0 0 0 10px rgba(236, 72, 153, 0.16), var(--shadow);
}

.tour-popover {
  position: fixed;
  z-index: 80;
  width: 340px;
  padding: 18px;
  border: 1px solid #f2a5cf;
  border-radius: 18px;
  background: #fff;
  box-shadow: var(--shadow);
}

.tour-popover h2 {
  margin-bottom: 8px;
  font-size: 18px;
}

.tour-popover p {
  font-size: 14px;
}

.mini-flow {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: 14px 0;
}

.mini-flow span {
  display: inline-flex;
  min-height: 24px;
  padding: 0 8px;
  align-items: center;
  border-radius: 999px;
  background: #f8fafc;
  color: #475467;
  font-size: 12px;
  font-weight: 800;
}

.mini-flow span.is-current {
  background: #fff0f7;
  color: var(--pink-dark);
}

.tour-actions {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-top: 12px;
}

.tutorial-banner {
  position: sticky;
  top: 72px;
  z-index: 40;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  margin-bottom: 18px;
  padding: 12px 16px;
  border: 1px solid #f2a5cf;
  border-radius: 14px;
  background: #fff8fc;
}

.tutorial-banner strong,
.tutorial-banner span {
  display: block;
}

.tutorial-banner span {
  margin-top: 2px;
  color: var(--muted);
}

.tutorial-banner button {
  min-height: 34px;
  padding: 0 12px;
  border-radius: 10px;
  background: #fff;
  color: var(--pink-dark);
  font-weight: 850;
}

.app-dialog {
  display: none;
  position: fixed;
  z-index: 75;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 520px;
  max-width: calc(100vw - 48px);
  border: 0;
  border-radius: 18px;
  padding: 0;
  box-shadow: var(--shadow);
}

.app-dialog.is-open {
  display: block;
}

.app-dialog form {
  display: grid;
  gap: 14px;
  padding: 20px;
}

.dialog-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.dialog-actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 4px;
}

.practice-note {
  padding: 10px 12px;
  border-radius: 12px;
  background: #f8fafc;
  color: #475467;
  font-size: 13px;
}

.workspace {
  min-height: calc(100vh - 120px);
}

.welcome-panel {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  margin-bottom: 18px;
  padding: 18px;
  border: 1px solid #f2a5cf;
  border-radius: 18px;
  background: linear-gradient(135deg, #fff8fc 0%, #ffffff 70%);
  box-shadow: 0 12px 30px rgba(236, 72, 153, 0.1);
}

.welcome-panel h2 {
  margin-bottom: 8px;
  font-size: 20px;
}

.welcome-panel p {
  max-width: 820px;
}

.welcome-actions {
  display: flex;
  gap: 10px;
  flex-shrink: 0;
}

.newbie-popover {
  width: 300px;
  padding: 14px;
}

.newbie-popover h2 {
  margin-bottom: 6px;
  font-size: 16px;
  line-height: 1.35;
}

.newbie-popover p {
  font-size: 13px;
  line-height: 1.45;
}

.newbie-popover .eyebrow {
  margin-bottom: 5px;
}

const lessonGroups = [
  {
    id: "intro",
    title: "认识第一次登录后的工作台",
    desc: "知道左侧菜单、顶部通知和新手引导分别做什么。",
    lessonIds: ["intro"]
  },
  {
    id: "setup",
    title: "完善资料与社媒认证",
    desc: "先完善个人信息，再完成社媒账号人工认证。",
    lessonIds: ["profile", "social"]
  },
  {
    id: "apply-flow",
    title: "找任务、报名与查看进度",
    desc: "从筛选任务、查看详情、提交报名，到跟踪报名进度。",
    lessonIds: ["find", "apply", "track"]
  },
  {
    id: "invite",
    title: "处理合作邀请",
    desc: "理解接受邀请后仍需平台审核。",
    lessonIds: ["invite"]
  },
  {
    id: "fulfill",
    title: "履约、修改重提和收益",
    desc: "学会提交产物、处理驳回、查看结算。",
    lessonIds: ["fulfill"]
  }
];

function renderView(name) {
  currentView = name;
  workspace.innerHTML = views[name] ? views[name]() : views.opportunities();
  navItems.forEach((item) => item.classList.toggle("is-active", item.dataset.nav === name));
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function renderLessonList() {
  lessonList.innerHTML = lessonGroups.map((lesson, index) => `
    <button class="guide-task ${completed.has(lesson.id) ? "is-complete" : ""}" data-lesson="${lesson.id}">
      <span>${index + 1}</span>
      <div><strong>${lesson.title}</strong><small>${lesson.desc}</small></div>
    </button>
  `).join("");
}

function updateProgress() {
  progressBar.style.width = `${(completed.size / lessonGroups.length) * 100}%`;
  renderLessonList();
}

function openDrawer() {
  drawer.classList.add("is-open");
  drawer.setAttribute("aria-hidden", "false");
}

function closeDrawer() {
  drawer.classList.remove("is-open");
  drawer.setAttribute("aria-hidden", "true");
}

function openDialog(name) {
  closeDialogs();
  const dialog = name === "apply" ? applyDialog : deliverableDialog;
  dialog.classList.add("is-open");
  dialog.setAttribute("aria-hidden", "false");
}

function closeDialogs() {
  [applyDialog, deliverableDialog].forEach((dialog) => {
    dialog.classList.remove("is-open");
    dialog.setAttribute("aria-hidden", "true");
  });
}

function clearHighlight() {
  document.querySelectorAll(".is-highlight").forEach((node) => node.classList.remove("is-highlight"));
}

function getTarget(id) {
  return id ? document.querySelector(`[data-tour-target="${id}"]`) || document.querySelector(`[data-action="${id}"]`) : null;
}

function renderFlow(items = []) {
  tourFlow.innerHTML = items.map((item, index) => `<span class="${index === Math.min(stepIndex, items.length - 1) ? "is-current" : ""}">${item}</span>`).join("");
}

function getGroupStepMeta() {
  if (!activeGroup) {
    const lesson = lessons.find((item) => item.id === activeLesson);
    return {
      title: lesson.title,
      current: stepIndex + 1,
      total: lesson.steps.length,
      isFinal: stepIndex === lesson.steps.length - 1
    };
  }

  const total = activeGroup.lessonIds.reduce((sum, lessonId) => {
    const lesson = lessons.find((item) => item.id === lessonId);
    return sum + lesson.steps.length;
  }, 0);
  const before = activeGroup.lessonIds.slice(0, activeGroupIndex).reduce((sum, lessonId) => {
    const lesson = lessons.find((item) => item.id === lessonId);
    return sum + lesson.steps.length;
  }, 0);
  const currentLesson = lessons.find((item) => item.id === activeLesson);
  return {
    title: activeGroup.title,
    current: before + stepIndex + 1,
    total,
    isFinal: activeGroupIndex === activeGroup.lessonIds.length - 1 && stepIndex === currentLesson.steps.length - 1
  };
}

function positionPopover(target) {
  const popRect = popover.getBoundingClientRect();
  if (!target) {
    popover.style.left = "calc(50vw - 190px)";
    popover.style.top = "150px";
    return;
  }
  const rect = target.getBoundingClientRect();
  let left = rect.right + 18;
  let top = rect.top;
  if (left + popRect.width > window.innerWidth - 20) left = Math.max(20, rect.left - popRect.width - 18);
  if (top + popRect.height > window.innerHeight - 20) top = Math.max(20, window.innerHeight - popRect.height - 20);
  popover.style.left = `${left}px`;
  popover.style.top = `${top}px`;
}

function renderStep() {
  const lesson = lessons.find((item) => item.id === activeLesson);
  const step = lesson.steps[stepIndex];
  clearHighlight();
  if (step.closeDialogs) closeDialogs();
  if (step.view) renderView(step.view);
  if (step.dialog) openDialog(step.dialog);

  tutorialBanner.hidden = false;
  const groupStep = getGroupStepMeta();
  bannerTitle.textContent = `${groupStep.title}：第 ${groupStep.current} / ${groupStep.total} 步`;
  bannerText.textContent = practiceCopy;
  overlay.hidden = false;
  popover.hidden = false;
  tourTitle.textContent = step.title;
  tourBody.textContent = step.body;
  coachDetail.innerHTML = "";
  renderFlow(step.flow || []);
  tourBack.disabled = stepIndex === 0;
  tourBack.style.visibility = stepIndex === 0 ? "hidden" : "visible";
  tourNext.textContent = groupStep.isFinal ? "完成本节" : "下一步";

  requestAnimationFrame(() => {
    const target = getTarget(step.target);
    if (target) {
      target.classList.add("is-highlight");
      target.scrollIntoView({ behavior: "smooth", block: "center", inline: "nearest" });
    }
    requestAnimationFrame(() => positionPopover(target));
  });
}

function startLesson(id) {
  activeGroup = lessonGroups.find((item) => item.id === id) || null;
  activeGroupIndex = 0;
  activeLesson = activeGroup ? activeGroup.lessonIds[0] : id;
  stepIndex = 0;
  closeDrawer();
  renderStep();
}

function finishLesson() {
  if (activeGroup && activeGroupIndex < activeGroup.lessonIds.length - 1) {
    activeGroupIndex += 1;
    activeLesson = activeGroup.lessonIds[activeGroupIndex];
    stepIndex = 0;
    renderStep();
    return;
  }

  completed.add(activeGroup ? activeGroup.id : activeLesson);
  activeLesson = null;
  activeGroup = null;
  activeGroupIndex = 0;
  stepIndex = 0;
  clearHighlight();
  overlay.hidden = true;
  popover.hidden = true;
  tutorialBanner.hidden = true;
  closeDialogs();
  updateProgress();
  openDrawer();
}

function nextStep() {
  if (!activeLesson) return;
  const lesson = lessons.find((item) => item.id === activeLesson);
  if (stepIndex >= lesson.steps.length - 1) {
    finishLesson();
    return;
  }
  stepIndex += 1;
  renderStep();
}

function prevStep() {
  if (!activeLesson || stepIndex === 0) return;
  stepIndex -= 1;
  renderStep();
}

function handleAction(action) {
  if (activeLesson) {
    const lesson = lessons.find((item) => item.id === activeLesson);
    const step = lesson.steps[stepIndex];
    if (step.action === action) {
      nextStep();
      return;
    }
  }
  if (action === "open-detail") renderView("campaignDetail");
  if (action === "apply-now") openDialog("apply");
  if (action === "submit-application") {
    closeDialogs();
    renderView("applications");
  }
  if (action === "accept-invite") renderView("projects");
  if (action === "submit-deliverable" || action === "resubmit-deliverable") openDialog("deliverable");
  if (action === "submit-content") {
    closeDialogs();
    renderView("projects");
  }
}

document.addEventListener("click", (event) => {
  const nav = event.target.closest("[data-nav]");
  if (nav) renderView(nav.dataset.nav);

  const lesson = event.target.closest("[data-lesson]");
  if (lesson) startLesson(lesson.dataset.lesson);

  const action = event.target.closest("[data-action]");
  if (action) {
    event.preventDefault();
    handleAction(action.dataset.action);
  }

  const cancel = event.target.closest('button[value="cancel"]');
  if (cancel) {
    event.preventDefault();
    closeDialogs();
  }
});

openGuide.addEventListener("click", openDrawer);
closeGuide.addEventListener("click", closeDrawer);
tourNext.addEventListener("click", nextStep);
tourBack.addEventListener("click", prevStep);
exitTutorial.addEventListener("click", () => {
  activeLesson = null;
  activeGroup = null;
  activeGroupIndex = 0;
  stepIndex = 0;
  clearHighlight();
  overlay.hidden = true;
  popover.hidden = true;
  tutorialBanner.hidden = true;
  closeDialogs();
});

window.addEventListener("resize", () => {
  if (!activeLesson) return;
  const lesson = lessons.find((item) => item.id === activeLesson);
  positionPopover(getTarget(lesson.steps[stepIndex].target));
});

renderView("opportunities");
renderLessonList();
updateProgress();

</script>
